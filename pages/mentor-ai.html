<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentor AI · Bright School</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/print.css" media="print">
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <style>
    /* ── Mentor AI page styles ── */
    .mentor-wrap { display: flex; gap: 1rem; height: calc(100vh - var(--topbar-h) - 120px); min-height: 480px; }

    /* Sidebar: history + quick prompts */
    .mentor-side {
      width: 260px; flex: none; display: flex; flex-direction: column; gap: .75rem;
      overflow: hidden;
    }
    .mentor-side .card-soft { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .history-list { flex: 1; overflow-y: auto; padding: .5rem; }
    .history-item {
      display: flex; align-items: center; gap: .5rem; padding: .45rem .6rem;
      border-radius: 8px; cursor: pointer; font-size: .82rem; color: var(--text);
      border: 1px solid transparent; transition: background .12s;
    }
    .history-item:hover { background: var(--surface-2); }
    .history-item.active { background: rgba(232,163,23,.14); border-color: rgba(232,163,23,.3); }
    .history-item i { color: var(--amber); flex: none; }
    .history-item .hi-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .hi-del { opacity: 0; font-size: .75rem; color: var(--muted); flex: none; }
    .history-item:hover .hi-del { opacity: 1; }

    /* Main chat area */
    .mentor-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .75rem; }
    .chat-window {
      flex: 1; overflow-y: auto; padding: 1rem 1.1rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      scroll-behavior: smooth;
    }

    /* Messages */
    .msg { display: flex; gap: .75rem; margin-bottom: 1rem; animation: msgIn .2s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px; border-radius: 50%; flex: none;
      display: grid; place-items: center; font-size: .8rem; font-weight: 700;
    }
    .msg.ai .msg-avatar { background: var(--navy); color: var(--amber); }
    .msg.user .msg-avatar { background: var(--amber); color: var(--navy); }
    .msg-body { max-width: 78%; }
    .msg-bubble {
      padding: .65rem .9rem; border-radius: 14px; font-size: .88rem; line-height: 1.6;
      word-break: break-word;
    }
    .msg.ai .msg-bubble { background: var(--surface-2); border-bottom-left-radius: 4px; }
    .msg.user .msg-bubble { background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }
    .msg-meta { font-size: .72rem; color: var(--muted); margin-top: .25rem; padding-inline: .2rem; }
    .msg.user .msg-meta { text-align: right; }

    /* Typing indicator */
    .typing-dots span {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted); margin: 0 2px;
      animation: bounce .9s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* Suggestions chips */
    .suggestions { display: flex; flex-wrap: wrap; gap: .4rem; padding: .5rem 0 .25rem; }
    .sug-chip {
      font-size: .78rem; padding: .28rem .7rem; border-radius: 99px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      transition: background .12s, border-color .12s;
    }
    .sug-chip:hover { background: rgba(232,163,23,.14); border-color: var(--amber); }

    /* Input bar */
    .chat-input-bar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: .6rem .75rem;
    }
    .chat-input-bar textarea {
      border: 0; background: transparent; resize: none; outline: none;
      width: 100%; font-size: .9rem; color: var(--text); max-height: 120px;
      font-family: inherit;
    }
    .chat-input-bar textarea::placeholder { color: var(--muted); }
    .input-actions { display: flex; align-items: center; gap: .4rem; margin-top: .4rem; }
    .char-count { font-size: .72rem; color: var(--muted); margin-inline-start: auto; }

    /* Quick prompt cards */
    .qp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .qp-card {
      padding: .6rem .75rem; border-radius: 10px; cursor: pointer; font-size: .8rem;
      border: 1px solid var(--border); background: var(--surface-2);
      transition: background .12s, border-color .12s; line-height: 1.4;
    }
    .qp-card:hover { background: rgba(232,163,23,.12); border-color: var(--amber); }
    .qp-card i { color: var(--amber); display: block; font-size: 1.1rem; margin-bottom: .25rem; }

    /* Stats bar */
    .ai-stats { display: flex; gap: 1rem; font-size: .75rem; color: var(--muted); flex-wrap: wrap; }
    .ai-stats span { display: flex; align-items: center; gap: .3rem; }

    /* Welcome screen */
    .welcome-screen { text-align: center; padding: 2rem 1rem; }
    .welcome-screen .ai-logo {
      width: 64px; height: 64px; border-radius: 18px; background: var(--navy);
      color: var(--amber); display: inline-grid; place-items: center; font-size: 1.8rem; margin-bottom: 1rem;
    }

    /* Markdown-like rendering */
    .msg-bubble strong { font-weight: 600; }
    .msg-bubble ul, .msg-bubble ol { padding-inline-start: 1.2rem; margin: .4rem 0; }
    .msg-bubble li { margin-bottom: .2rem; }
    .msg-bubble code { background: rgba(0,0,0,.08); padding: .1rem .35rem; border-radius: 4px; font-size: .82em; }
    .msg.user .msg-bubble code { background: rgba(255,255,255,.15); }
    .msg-bubble table { width: 100%; border-collapse: collapse; font-size: .82rem; margin: .5rem 0; }
    .msg-bubble th, .msg-bubble td { border: 1px solid var(--border); padding: .3rem .5rem; }
    .msg-bubble th { background: var(--surface-2); font-weight: 600; }

    /* Copy button on AI messages */
    .msg-actions { display: flex; gap: .3rem; margin-top: .3rem; opacity: 0; transition: opacity .15s; }
    .msg:hover .msg-actions { opacity: 1; }
    .msg-actions button { font-size: .72rem; padding: .15rem .45rem; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); }
    .msg-actions button:hover { color: var(--text); }

    @media (max-width: 767.98px) {
      .mentor-side { display: none; }
      .mentor-wrap { height: calc(100vh - var(--topbar-h) - 160px); }
    }
  </style>
</head>
<body data-page="mentor-ai" data-title-key="m_mentor" data-group="g_workflow">
  <a class="visually-hidden-focusable skip-link" href="#page">Skip to content</a>

  <main id="page" tabindex="-1">
    <div class="page-head">
      <div>
        <h1 class="h3 mb-1"><i class="bi bi-stars text-warning me-2"></i>Mentor AI</h1>
        <p class="text-muted mb-0">Your intelligent school management assistant — powered by live demo data.</p>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <div class="ai-stats" id="aiStats"></div>
        <button class="btn btn-sm btn-outline-secondary" id="exportBtn" title="Export chat"><i class="bi bi-download me-1"></i>Export</button>
        <button class="btn btn-sm btn-outline-danger" id="clearBtn" title="Clear conversation"><i class="bi bi-trash me-1"></i>Clear</button>
        <button class="btn btn-sm btn-warning" id="newChatBtn"><i class="bi bi-plus-lg me-1"></i>New Chat</button>
      </div>
    </div>

    <div class="mentor-wrap">
      <!-- Sidebar: history + quick prompts -->
      <div class="mentor-side">
        <div class="card-soft">
          <div class="card-head" style="font-size:.82rem;">
            <span><i class="bi bi-clock-history me-1"></i>History</span>
            <button class="btn btn-link btn-sm p-0 text-muted" id="clearHistoryBtn" title="Clear all history"><i class="bi bi-x-lg"></i></button>
          </div>
          <div class="history-list" id="historyList"></div>
        </div>
      </div>

      <!-- Main chat -->
      <div class="mentor-main">
        <div class="chat-window" id="chatWindow" role="log" aria-live="polite" aria-label="Chat messages"></div>

        <!-- Suggestions row -->
        <div class="suggestions" id="suggestionsRow"></div>

        <!-- Input bar -->
        <div class="chat-input-bar">
          <textarea id="chatInput" rows="2" placeholder="Ask anything about students, fees, attendance, exams…" maxlength="800" aria-label="Message input"></textarea>
          <div class="input-actions">
            <button class="btn btn-sm btn-outline-secondary" id="voiceBtn" title="Voice input (demo)"><i class="bi bi-mic"></i></button>
            <button class="btn btn-sm btn-outline-secondary" id="attachBtn" title="Attach context"><i class="bi bi-paperclip"></i></button>
            <span class="char-count" id="charCount">0 / 800</span>
            <button class="btn btn-sm btn-primary ms-2" id="sendBtn" disabled>
              <i class="bi bi-send-fill me-1"></i>Send
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/mentor-ai.js"></script>
</body>
</html>
