<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Bright School</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/print.css" media="print">
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
</head>
<body data-page="dashboard" data-title-key="m_dashboard" data-group="g_overview">
  <a class="visually-hidden-focusable skip-link" href="#page">Skip to content</a>

  <main id="page" tabindex="-1">
    <!-- Greeting -->
    <div class="page-head">
      <div>
        <p class="text-muted small mb-1" id="todayLabel"></p>
        <h1 class="h3 mb-1" id="greeting">Welcome</h1>
        <p class="text-muted mb-0" id="subline"></p>
      </div>
      <div class="d-flex flex-wrap gap-2" id="quickActions" aria-label="Quick actions"></div>
    </div>

    <!-- KPI cards (skeleton first, then filled by dashboard.js) -->
    <section aria-label="Key figures"><div class="row g-3 mb-3" id="kpiRow"></div></section>

    <!-- Charts -->
    <div class="row g-3 mb-3">
      <div class="col-12 col-lg-8" id="cardFee">
        <section class="card-soft h-100" aria-labelledby="feeTitle">
          <div class="card-head flex-wrap gap-2"><span id="feeTitle">Monthly fee collection</span><div class="d-flex align-items-center gap-2"><label class="visually-hidden" for="feeRange">Chart range</label><select class="form-select form-select-sm w-auto" id="feeRange" aria-label="Fee chart period"><option value="3">3 months</option><option value="6" selected>6 months</option><option value="12">12 months</option></select><button class="btn btn-sm btn-outline-secondary" id="exportDashboard" title="Download dashboard summary"><i class="bi bi-download me-1"></i>Export</button><button class="btn btn-sm btn-outline-primary" id="printDashboard" title="Print dashboard"><i class="bi bi-printer me-1"></i>Print</button><a class="btn btn-sm btn-outline-primary" href="fee.html">Open fees</a></div></div>
          <div class="card-body-x"><div class="chart-box"><canvas id="feeChart" role="img" aria-label="Bar chart of billed and collected fees per month"></canvas></div></div>
        </section>
      </div>
      <div class="col-12 col-lg-4" id="cardAtt">
        <section class="card-soft h-100" aria-labelledby="attTitle">
          <div class="card-head"><span id="attTitle">Attendance trend</span><a class="btn btn-sm btn-outline-primary" href="attendance.html">Open</a></div>
          <div class="card-body-x"><div class="chart-box"><canvas id="attChart" role="img" aria-label="Line chart of attendance percentage"></canvas></div></div>
        </section>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-4" id="cardCls">
        <section class="card-soft h-100" aria-labelledby="clsTitle">
          <div class="card-head flex-wrap gap-2"><div><span id="clsTitle">Class &amp; section overview</span><small class="d-block text-muted" id="sectionSummary"></small></div><div class="d-flex gap-2 align-items-center"><label class="visually-hidden" for="classSectionFilter">Filter by class</label><select class="form-select form-select-sm w-auto" id="classSectionFilter"><option value="all">All classes</option></select><a class="btn btn-sm btn-outline-primary" href="settings.html">Manage</a></div></div>
          <div class="card-body-x p-0 section-overview-scroll"><table class="table table-modern mb-0"><thead><tr><th>Class / Section</th><th class="text-center">Students</th><th class="text-center">Present</th><th class="text-end">Monthly fee</th></tr></thead><tbody id="classSectionBody"></tbody></table></div>
        </section>
      </div>
      <div class="col-12 col-lg-4" id="cardAct">
        <section class="card-soft h-100" aria-labelledby="actTitle">
          <div class="card-head"><span id="actTitle">Recent activity</span></div>
          <div class="card-body-x" id="activityList"></div>
        </section>
      </div>
      <div class="col-12 col-lg-4" id="cardAnn">
        <section class="card-soft h-100" aria-labelledby="annTitle">
          <div class="card-head"><span id="annTitle">Announcements</span><button class="btn btn-sm btn-warning" id="newAnnBtn"><i class="bi bi-plus-lg me-1"></i>New</button></div>
          <div class="card-body-x" id="announceList"></div>
        </section>
      </div>
    </div>

    <!-- New announcement modal -->
    <div class="modal fade" id="annModal" tabindex="-1" aria-labelledby="annModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="annForm" novalidate>
        <div class="modal-header"><h2 class="modal-title fs-5" id="annModalTitle">New announcement</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body vstack gap-3">
          <div><label class="form-label" for="annTitleIn">Title</label><input class="form-control" id="annTitleIn" required maxlength="80"><div class="invalid-feedback">Please enter a title.</div></div>
          <div><label class="form-label" for="annTextIn">Message</label><textarea class="form-control" id="annTextIn" rows="3" required maxlength="240"></textarea><div class="invalid-feedback">Please write a short message.</div></div>
          <div><label class="form-label" for="annTagIn">Category</label><select class="form-select" id="annTagIn"><option>Notice</option><option>Event</option><option>Exam</option><option>Fee</option></select></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Publish</button></div>
      </form></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
