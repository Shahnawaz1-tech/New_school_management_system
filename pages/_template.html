<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page title · Bright School</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/print.css" media="print">

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
</head>
<!-- data-page = menu id, data-group = breadcrumb group key (see layout.js) -->
<body data-page="dashboard" data-title-key="m_dashboard" data-group="g_overview">
  <a class="visually-hidden-focusable skip-link" href="#page">Skip to content</a>

  <!-- layout.js wraps this <main> with sidebar, top bar and breadcrumbs -->
  <main id="page" tabindex="-1">
    <div class="page-head">
      <div><h1 class="h3 mb-1">Page title</h1><p class="text-muted mb-0">Short description.</p></div>
    </div>
    <div id="content"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/layout.js"></script>

</html>
